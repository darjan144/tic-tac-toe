<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SoundAds Dashboard</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1b1d22; --muted:#6b7280; --line:#e5e7eb; --accent:#e0a800; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111317; --card:#1a1d23; --ink:#e8eaed; --muted:#9aa0a6; --line:#2a2e36; } }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui, -apple-system, Segoe UI, sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width:1000px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:22px; margin:0 0 4px; } h1 span { color:var(--accent); }
  .sub { color:var(--muted); margin:0 0 20px; }
  .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:24px; }
  .tile { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; }
  .tile b { display:block; font-size:26px; font-variant-numeric:tabular-nums; }
  .tile small { color:var(--muted); }
  section { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:4px 16px 12px; margin-bottom:16px; overflow-x:auto; }
  h2 { font-size:15px; margin:12px 0 8px; }
  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
  th, td { text-align:right; padding:6px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th:first-child, td:first-child { text-align:left; }
  th { color:var(--muted); font-weight:600; font-size:13px; }
  .bar { display:inline-block; height:6px; background:var(--accent); border-radius:3px; vertical-align:middle; margin-left:6px; }
  .empty { color:var(--muted); padding:8px 0; }
</style>
</head>
<body>
<main>
  <h1>Sound<span>Ads</span> dashboard</h1>
  <p class="sub">Live tracking events from the Unity SDK. Refreshes every 5 seconds. <span id="updated"></span></p>
  <div class="tiles">
    <div class="tile"><b id="t-imp">0</b><small>Impressions</small></div>
    <div class="tile"><b id="t-cmp">0</b><small>Completions</small></div>
    <div class="tile"><b id="t-rate">0%</b><small>Completion rate</small></div>
    <div class="tile"><b id="t-rew">0</b><small>Rewards granted</small></div>
    <div class="tile"><b id="t-mute">0</b><small>Mutes</small></div>
    <div class="tile"><b id="t-ses">0</b><small>Consented sessions</small></div>
  </div>
  <section><h2>By ad</h2><div id="byAd"></div></section>
  <section><h2>By moment</h2><div id="byMoment"></div></section>
  <section><h2>By placement</h2><div id="byPlacement"></div></section>
</main>
<script>
  const el = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  function table(rows, label) {
    if (!rows.length) return '<p class="empty">No events yet. Play an ad in the game.</p>';
    return `<table><thead><tr><th>${label}</th><th>Impressions</th><th>Completes</th><th>Mutes</th><th>Rewards</th><th>Completion</th></tr></thead><tbody>` +
      rows.map(r => `<tr><td>${esc(r.key)}</td><td>${r.impressions}</td><td>${r.completes}</td><td>${r.mutes}</td><td>${r.rewards}</td>` +
        `<td>${Math.round(r.completionRate * 100)}%<span class="bar" style="width:${Math.round(r.completionRate * 60)}px"></span></td></tr>`).join('') +
      '</tbody></table>';
  }

  async function refresh() {
    try {
      const r = await (await fetch('/v1/report')).json();
      const sum = k => r.byAd.reduce((a, x) => a + x[k], 0);
      const imp = sum('impressions'), cmp = sum('completes');
      el('t-imp').textContent = imp;
      el('t-cmp').textContent = cmp;
      el('t-rate').textContent = imp ? Math.round(cmp / imp * 100) + '%' : '0%';
      el('t-rew').textContent = sum('rewards');
      el('t-mute').textContent = sum('mutes');
      el('t-ses').textContent = r.uniqueSessions;
      el('byAd').innerHTML = table(r.byAd, 'Ad');
      el('byMoment').innerHTML = table(r.byMoment, 'Moment');
      el('byPlacement').innerHTML = table(r.byPlacement, 'Placement');
      el('updated').textContent = 'Updated ' + new Date().toLocaleTimeString();
    } catch (e) {
      el('updated').textContent = 'Server unreachable';
    }
  }
  refresh();
  setInterval(refresh, 5000);
</script>
</body>
</html>
